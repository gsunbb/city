<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시 조사 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 측량도 느낌: 옅은 바다색 위에 시도별 담채, 선택은 코발트 한 가지 */
  --sea:#e4ebef; --paper:#fbfcfb; --ink:#18242c; --muted:#5a6872; --line:#cfd8dd;
  --accent:#1d58b8; --accent-ink:#ffffff; --accent-soft:#dbe6f7;
  --land-l:89%; --land-s:40%; --edge:#ffffff;
  --font-display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0e171d; --paper:#151f26; --ink:#e3eaee; --muted:#9aa8b1; --line:#2a3842;
    --accent:#6c9df0; --accent-ink:#0b1420; --accent-soft:#1c2c45;
    --land-l:25%; --land-s:22%; --edge:#0e171d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0e171d; --paper:#151f26; --ink:#e3eaee; --muted:#9aa8b1; --line:#2a3842;
  --accent:#6c9df0; --accent-ink:#0b1420; --accent-soft:#1c2c45;
  --land-l:25%; --land-s:22%; --edge:#0e171d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-body);display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;border-bottom:1px solid var(--line)}
header h1{font:700 19px/1.2 var(--font-display);margin:0;letter-spacing:-.01em}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;border-radius:4px;cursor:pointer;color:var(--muted)}
.crumbs button:hover{color:var(--accent)}
.crumbs .cur{color:var(--ink);font-weight:600}
.search{margin-left:auto;position:relative;min-width:220px;flex:0 1 300px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.search ul{position:absolute;z-index:5;top:calc(100% + 4px);left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:320px;overflow:auto}
.search li button{width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.search li button:hover,.search li button.on{background:var(--accent-soft)}
.search li small{color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.mapwrap{position:relative;background:var(--sea);min-height:0;overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:manipulation}
.sido-fill{stroke:none}
.sgg{stroke:var(--edge);stroke-width:var(--sw,4);cursor:pointer;transition:fill .15s,opacity .2s}
.sgg.dim{opacity:.45}
.sgg:hover{filter:brightness(.93)}
.sgg.sel{fill:var(--accent)!important;opacity:1}
.sido-edge{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:var(--sw2,7);pointer-events:none;stroke-linejoin:round}
.sido-edge.cur{stroke:var(--accent);stroke-opacity:1}
.lbl{font-family:var(--font-body);font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.lbl.sel{fill:var(--accent-ink);stroke:var(--accent)}
.maptools{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;align-items:center}
.chipbtn{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.legend{font:12px var(--font-mono);color:var(--muted);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:4px 10px;border-radius:6px}

aside{border-left:1px solid var(--line);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:500 12px var(--font-mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.card h2{font:700 30px/1.15 var(--font-display);margin:4px 0 2px;text-wrap:balance}
.card .parent{color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.home{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600}
.home small{font:400 12px var(--font-mono);opacity:.85;word-break:break-all;text-align:right}
.home:hover{filter:brightness(1.08)}
.group h3{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;flex-direction:column;gap:1px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-size:14px;font-weight:500}
.links a small{font-size:12px;color:var(--muted);font-weight:400}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.list button{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:13.5px;text-align:left}
.list button:hover{border-color:var(--accent);color:var(--accent)}
.list button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.intro p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.note p{margin:0 0 4px}
.err{padding:20px;color:var(--muted)}

@media (max-width:820px){
  body{display:block;height:auto}
  main{grid-template-columns:1fr;grid-template-rows:56vh auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .search{flex:1 1 100%;margin-left:0}
}
@media (prefers-reduced-motion: reduce){.sgg{transition:none}}
</style>
</head>
<body>
<header>
  <h1>도시 조사 지도</h1>
  <nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>
  <div class="search">
    <label for="q" class="eyebrow" style="position:absolute;left:-9999px">지역 검색</label>
    <input id="q" type="search" placeholder="지역 이름 검색 (예: 강릉, 해운대구)" autocomplete="off">
    <ul id="results" hidden></ul>
  </div>
</header>
<main>
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="대한민국 시도·시군구 지도"></svg>
    <div class="maptools">
      <button class="chipbtn" id="home" type="button">전국 보기</button>
      <span class="legend" id="legend"></span>
    </div>
  </div>
  <aside id="panel"><div class="err">지도 데이터를 불러오는 중입니다.</div></aside>
</main>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map'), panel=document.getElementById('panel'), crumbs=document.getElementById('crumbs');
let D=null, SIDO={}, SGG={}, view=null, curSido=null, curSgg=null, anim=null;
const GOV={'구':'구청','시':'시청','군':'군청','도':'도청'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function hue(code){const order=['11','28','41','51','43','36','30','44','52','12','47','27','31','26','48','50'];return Math.round(order.indexOf(code)*360/16+12)%360}
function tint(code,shift){return `hsl(${(hue(code)+(shift||0))%360} var(--land-s) var(--land-l))`}
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

Promise.resolve(JSON.parse(document.getElementById('map-data').textContent)).then(init).catch(()=>{panel.innerHTML='<div class="err">지도 데이터를 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div>'});

function init(data){
  D=data; data.sido.forEach(s=>SIDO[s.code]=s); data.sgg.forEach(u=>SGG[u.code]=u);
  const gS=el('g',{}), gU=el('g',{}), gE=el('g',{}), gL=el('g',{});
  data.sido.forEach(s=>{s.fill=el('path',{d:s.d,class:'sido-fill',fill:tint(s.code)});gS.appendChild(s.fill)});
  data.sgg.forEach((u,i)=>{
    u.el=el('path',{d:u.d,class:'sgg',fill:tint(u.sido,(i%3)*4-4)});
    const t=el('title',{});t.textContent=SIDO[u.sido].name+' '+u.name+' · 인구 '+u.pop.toLocaleString('ko-KR')+'명';u.el.appendChild(t);
    u.el.addEventListener('click',()=>{ if(curSido!==u.sido) go('s-'+u.sido); else go('r-'+u.code) });
    gU.appendChild(u.el);
  });
  data.sido.forEach(s=>{s.edge=el('path',{d:s.d,class:'sido-edge'});gE.appendChild(s.edge)});
  svg.append(gS,gU,gE,gL); svg.gL=gL;
  document.getElementById('home').onclick=()=>go('');
  setupSearch();
  window.addEventListener('hashchange',route);
  window.addEventListener('resize',()=>{if(view)setView(target(),true)});
  route();
}

function go(hash){
  if(hash){ if(location.hash.slice(1)===hash) route(); else location.hash=hash; }
  else { try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''} route(); }
}

function route(){
  const m=location.hash.slice(1);
  let s=null,u=null;
  if(/^r-\d{5}$/.test(m)&&SGG[m.slice(2)]){u=SGG[m.slice(2)];s=u.sido}
  else if(/^s-\d{2}$/.test(m)&&SIDO[m.slice(2)]){s=m.slice(2)}
  curSido=s; curSgg=u?u.code:null;
  render();
}

function target(){
  let b;
  if(curSido) b=SIDO[curSido].b; else b=D.view;
  const pad=curSido?0.08:0.03;
  b=[b[0]-b[2]*pad,b[1]-b[3]*pad,b[2]*(1+2*pad),b[3]*(1+2*pad)];
  // 화면 비율에 맞추기
  const r=svg.clientWidth/Math.max(1,svg.clientHeight), br=b[2]/b[3];
  if(br>r){const nh=b[2]/r;b=[b[0],b[1]-(nh-b[3])/2,b[2],nh]} else {const nw=b[3]*r;b=[b[0]-(nw-b[2])/2,b[1],nw,b[3]]}
  return b;
}
function setView(b,instant){
  if(anim)cancelAnimationFrame(anim);
  const from=view||b, t0=performance.now(), dur=(instant||reduce||!view)?0:450;
  const step=now=>{
    const k=dur?Math.min(1,(now-t0)/dur):1, e=1-Math.pow(1-k,3);
    view=from.map((v,i)=>v+(b[i]-v)*e);
    svg.setAttribute('viewBox',view.map(v=>v.toFixed(1)).join(' '));
    const sw=view[2]/900; svg.style.setProperty('--sw',(sw*0.9).toFixed(2)); svg.style.setProperty('--sw2',(sw*1.8).toFixed(2));
    if(k<1)anim=requestAnimationFrame(step); else drawLabels();
  };
  anim=requestAnimationFrame(step);
}

function drawLabels(){
  const g=svg.gL; g.textContent='';
  const fs=view[2]/(svg.clientWidth<600?34:58);
  const items=curSido?D.sgg.filter(u=>u.sido===curSido).map(u=>({x:u.lx,y:u.ly,t:u.name,b:u.b,sel:u.code===curSgg})):D.sido.map(s=>({x:s.lx,y:s.ly,t:s.short,b:s.b}));
  items.forEach(it=>{
    const small=curSido && it.b[2]<fs*it.t.length*0.55 && it.b[3]<fs*1.6 && !it.sel;
    const size=small?fs*0.72:fs;
    const t=el('text',{x:it.x,y:it.y,class:'lbl'+(it.sel?' sel':''),'font-size':size.toFixed(1),'stroke-width':(size*0.22).toFixed(1)});
    t.textContent=it.t; g.appendChild(t);
  });
}

function render(){
  D.sgg.forEach(u=>{
    u.el.classList.toggle('dim',!!curSido&&u.sido!==curSido);
    u.el.classList.toggle('sel',u.code===curSgg);
  });
  D.sido.forEach(s=>s.edge.classList.toggle('cur',s.code===curSido));
  setView(target());
  const S=curSido&&SIDO[curSido], U=curSgg&&SGG[curSgg];
  crumbs.innerHTML='';
  const cb=(txt,hash,cur)=>{const b=document.createElement(cur?'span':'button');b.textContent=txt;if(cur)b.className='cur';else{b.type='button';b.onclick=()=>go(hash)}crumbs.appendChild(b)};
  const sep=()=>crumbs.appendChild(document.createTextNode('›'));
  cb('전국','',!S); if(S){sep();cb(S.name,'s-'+S.code,!U)} if(U){sep();cb(U.name,'',true)}
  document.getElementById('legend').textContent=S?`${S.short} · ${D.sgg.filter(u=>u.sido===S.code).length}개 시군구`:`16개 시도 · ${D.sgg.length}개 시군구`;
  panel.textContent='';
  hallIdx=0;
  if(U) panel.append(card(U,S,true));
  else if(S) panel.append(card(S,null,false));
  else panel.append(intro());
  if(S) panel.append(list(S));
  panel.append(note());
  if(U||S) panel.scrollTop=0;
  bindSeg(U||S, U?S:null);
}

function kind(name){return GOV[name.slice(-1)]?name.slice(-1):'시'}
function officeName(name){ if(name==='세종시'||name==='세종특별자치시') return '세종특별자치시청'; if(name==='전남광주통합특별시') return '전남광주통합특별시청'; return name+(GOV[kind(name)]||'청').slice(1)}
// 청사 검색어: 지도 서비스에서 시청·군청·구청 위치로 바로 열리도록
const SIDO_HALL={'서울특별시':'서울특별시청','부산광역시':'부산광역시청','대구광역시':'대구광역시청','인천광역시':'인천광역시청','대전광역시':'대전광역시청','울산광역시':'울산광역시청','세종특별자치시':'세종특별자치시청','경기도':'경기도청','충청북도':'충청북도청','충청남도':'충청남도청','경상북도':'경상북도청','경상남도':'경상남도청','강원특별자치도':'강원특별자치도청','전북특별자치도':'전북특별자치도청','제주특별자치도':'제주특별자치도청'};
function halls(r,parent){
  if(!parent){
    if(r.name==='전남광주통합특별시') return [['광주청사','전남광주통합특별시 광주청사'],['무안청사','전남광주통합특별시 무안청사'],['동부청사','전남광주통합특별시 동부청사']];
    return [[SIDO_HALL[r.name],SIDO_HALL[r.name]]];
  }
  const office=officeName(r.name);
  if(r.name==='세종시') return [['세종특별자치시청','세종특별자치시청']];
  if(parent.code==='50') return [[office,office]];
  let pre=parent.short;
  if(parent.code==='12') pre=r.name.endsWith('구')?'광주':'전남';
  return [[office,pre+' '+office]];
}
let hallIdx=0;
function links(r,parent){
  const full=parent?parent.name+' '+r.name:r.name;
  const H=halls(r,parent), hq=H[Math.min(hallIdx,H.length-1)][1];
  const E=encodeURIComponent, qq=E(hq).replace(/%20/g,'+');
  return {
    halls:H, hall:H[Math.min(hallIdx,H.length-1)][0],
    sat:[
      ['구글 위성지도','청사 위성 사진',`https://www.google.com/maps/search/${qq}/@${r.lat},${r.lng},14z/data=!3m1!1e3`],
      ['구글 어스','청사 3D 위성',`https://earth.google.com/web/search/${qq}`],
      ['카카오맵','청사 위치 · 스카이뷰 전환',`https://map.kakao.com/link/search/${E(hq)}`],
      ['네이버지도','청사 위치 · 위성 레이어',`https://map.naver.com/p/search/${E(hq)}`]
    ],
    ref:[
      ['위키백과','지역 개요',`https://ko.wikipedia.org/w/index.php?search=${E(full)}`],
      ['네이버 뉴스','최근 소식',`https://search.naver.com/search.naver?where=news&query=${E(full)}`],
      ['통계 (KOSIS)','인구·통계',`https://kosis.kr/search/search.do?query=${E(full)}`]
    ]
  };
}
function card(r,parent,isSgg){
  const L=links(r,parent), host=r.url.replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  const code=isSgg?r.code:r.code;
  const linkHtml=a=>a.map(([t,s,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗<small>${esc(s)}</small></a>`).join('');
  return h(`<section class="card">
    <div class="eyebrow">${isSgg?'시·군·구':'시·도'} · 코드 ${esc(code)}</div>
    <h2>${esc(r.name)}</h2>
    <div class="parent">${parent?esc(parent.name):'광역자치단체'}</div>
    <dl class="facts">
      <dt>인구</dt><dd>${r.pop.toLocaleString('ko-KR')}명 <span style="color:var(--muted)">(${esc(D.popDate.replace('-','.'))}.)</span></dd>
      <dt>인구밀도</dt><dd>${Math.round(r.pop/r.area).toLocaleString('ko-KR')}명/km²</dd>
      <dt>면적</dt><dd>${r.area.toLocaleString('ko-KR',{maximumFractionDigits:1})} km²</dd>
      <dt>중심 좌표</dt><dd>${r.lat.toFixed(4)}°N, ${r.lng.toFixed(4)}°E</dd>
    </dl>
    <a class="home" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><span>${esc(officeName(r.name))} 홈페이지 ↗</span><small>${esc(host)}</small></a>
  </section>
  <section class="group" id="satgroup"><h3>위성지도 · ${esc(L.hall)}</h3>${L.halls.length>1?`<div class="seg" role="group" aria-label="청사 선택">${L.halls.map((x,i)=>`<button type="button" data-i="${i}" class="${x[0]===L.hall?'on':''}">${esc(x[0])}</button>`).join('')}</div><p class="hint">세 청사를 나눠 쓰고 있어 청사를 골라 볼 수 있습니다.</p>`:''}<div class="links">${linkHtml(L.sat)}</div></section>
  <section class="group"><h3>조사 자료</h3><div class="links">${linkHtml(L.ref)}</div></section>`);
}
function bindSeg(r,parent){
  panel.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    hallIdx=+b.dataset.i;
    const g=panel.querySelector('#satgroup'), c=card(r,parent,!!parent);
    g.replaceWith(c.querySelector('#satgroup'));
    bindSeg(r,parent);
  });
}
function list(S){
  const us=D.sgg.filter(u=>u.sido===S.code);
  const f=h(`<section class="group"><h3>${esc(S.name)}의 시·군·구 ${us.length}곳</h3><div class="list"></div></section>`);
  const box=f.querySelector('.list');
  us.forEach(u=>{const b=document.createElement('button');b.type='button';b.textContent=u.name;if(u.code===curSgg)b.className='on';b.onclick=()=>go('r-'+u.code);box.appendChild(b)});
  return f;
}
function intro(){
  const f=h(`<section class="intro"><div class="eyebrow">시작하기</div><h2 style="font:700 24px/1.25 var(--font-display);margin:4px 0 0">조사할 지역을 고르세요</h2>
  <p>지도에서 시·도를 누르면 그 안의 시·군·구가 펼쳐집니다. 시·군·구를 누르면 공식 홈페이지와 위성지도, 조사 자료 링크가 이 자리에 나옵니다.</p></section>
  <section class="group"><h3>시·도 16곳</h3><div class="list"></div></section>`);
  const box=f.querySelector('.list');
  D.sido.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s.name;b.onclick=()=>go('s-'+s.code);box.appendChild(b)});
  return f;
}
function note(){
  return h(`<div class="note"><p>경계: 통계청 행정동 경계 기반 admdongkor ${esc(D.source)}판. 일반구가 있는 시(수원·창원 등)는 시 하나로 묶었습니다.</p><p>인구: 행정안전부 주민등록 인구(${esc(D.popDate.replace('-','년 '))}월 말, 외국인 제외). 홈페이지: 행정안전부 지자체 누리집 목록.</p><p>면적은 경계 데이터로 계산한 근삿값이라 공식 면적과 조금 다를 수 있습니다.</p></div>`);
}

function setupSearch(){
  const q=document.getElementById('q'), ul=document.getElementById('results');
  let hits=[], idx=0;
  const all=D.sido.map(s=>({t:s.name,sub:'시·도',h:'s-'+s.code,k:s.name+s.short})).concat(D.sgg.map(u=>({t:u.name,sub:SIDO[u.sido].name,h:'r-'+u.code,k:u.name+SIDO[u.sido].name+SIDO[u.sido].short})));
  const show=()=>{
    const v=q.value.trim().replace(/\s+/g,'');
    if(!v){ul.hidden=true;return}
    hits=all.filter(a=>a.k.includes(v)).sort((a,b)=>(b.t.startsWith(v))-(a.t.startsWith(v))).slice(0,10); idx=0;
    ul.innerHTML='';
    if(!hits.length){ul.innerHTML='<li style="padding:8px 10px;color:var(--muted)">일치하는 지역이 없습니다</li>';ul.hidden=false;return}
    hits.forEach((a,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.className=i===idx?'on':'';b.innerHTML=`<span>${esc(a.t)}</span><small>${esc(a.sub)}</small>`;b.onmousedown=e=>{e.preventDefault();pick(a)};li.appendChild(b);ul.appendChild(li)});
    ul.hidden=false;
  };
  const pick=a=>{q.value='';ul.hidden=true;q.blur();go(a.h)};
  q.addEventListener('input',show);
  q.addEventListener('keydown',e=>{
    if(ul.hidden||!hits.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();idx=(idx+(e.key==='ArrowDown'?1:hits.length-1))%hits.length;[...ul.querySelectorAll('button')].forEach((b,i)=>b.className=i===idx?'on':'')}
    else if(e.key==='Enter'){e.preventDefault();pick(hits[idx])}
    else if(e.key==='Escape'){ul.hidden=true}
  });
  q.addEventListener('blur',()=>setTimeout(()=>ul.hidden=true,100));
}
})();
</script>
</body>
